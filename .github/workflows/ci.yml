name: CI

# PR/push gate: typecheck (src + tests), unit tests, build. The full-engine
# parity suites self-skip when the ~5.6 GB dev artifacts are absent, so a plain
# checkout runs everything else without downloading weights. Releases still run
# their own verification in release.yml before publishing.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # windows is a first-class target (dev box + onnxruntime-node prebuilds);
        # it has caught fs/timing bugs the ubuntu runner never saw.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run typecheck:tests

      - run: npm test

      - run: npm run build
